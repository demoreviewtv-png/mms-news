<!DOCTYPE html>
<html>
  <head>
    <title>Macon Middle School News!</title>
    <style>
      body{
        font-family: "Inter", sans-serif;
        font-size: 10px;
      }
      h1{
        color: #050505;
        font-size: 40px;
      }
      img{
        border-size: 2px;
        border-color: #050505;
      }
      .page-title{
        color: #F00000;
      }
      .post-header{
        font-size: 30px;
        color: #880000;
      }
    .post-preview-list {
  display: flex;
  flex-direction: column;
  gap: 30px;
  margin-top: 20px;
}

.post-item {
  display: grid; 
  grid-template-columns: 150px 1fr; 
  gap: 20px; 
  align-items: center;
  padding-bottom: 20px;
  border-bottom: 1px solid #eee;
}

.post-image {
  width: 100%;
  height: 100px;
  object-fit: cover;
  border-radius: 6px;
}

.post-header {
  font-size: 1.4rem;
  margin: 0 0 5px 0;
  color: #002855;
}

.post-date {
  font-size: 0.85rem;
  color: #666;
  margin: 0 0 8px 0;
}

.post-excerpt {
  font-size: 1rem;
  margin: 0;
  color: #333;
  line-height: 1.4;
}

    </style>
  </head>
  <body>
    <h1 class="page-title">Welcome To MMS News!</h1>
    <p>Where you can find all news from Macon Middle School!</p>
    <a href="https://mms.macon.k12.nc.us/">To The OFFICIAL MMS Site (https://mms.macon.k12.nc.us/)</a>
    <hr>
    <img class="post-image" src="./logo.png" alt="MMS Event">
      <div class="post-content">
        <h2 class="post-header">MMS Principal Celebration</h2>
        <p class="post-date">October 22, 2026</p>
        <p class="post-excerpt">Join us in celebrating our principal this week! Read more about the special events planned at Macon Middle School...</p>
      </div>
  </body>
</html>
